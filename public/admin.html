<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claudio Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #141414; --surface2: #1e1e1e;
      --border: #2a2a2a; --text: #ffffff; --muted: #888888;
      --accent: #c8a96e; --accent-dim: rgba(200,169,110,0.15);
      --danger: #e05c5c; --success: #4caf50;
      --radius: 10px; --radius-sm: 6px;
    }
    html, body { min-height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    #app { max-width: 1000px; margin: 0 auto; padding: 0 16px 40px; }

    /* Topbar */
    .topbar { display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
    .topbar-title { font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: 0.02em; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .topbar-user { font-size: 0.82rem; color: var(--muted); }

    /* Auth */
    .auth-wrap { max-width: 380px; margin: 80px auto 0; }
    .auth-logo { text-align: center; margin-bottom: 32px; }
    .auth-logo h1 { font-size: 2rem; font-weight: 800; color: var(--accent); }
    .auth-logo p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; }
    .form-group input { width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); font-size: 0.95rem;
      padding: 11px 13px; outline: none; transition: border-color 0.15s; }
    .form-group input:focus { border-color: var(--accent); }
    .btn-primary { width: 100%; background: var(--accent); color: #0a0a0a; border: none;
      border-radius: var(--radius-sm); font-size: 0.95rem; font-weight: 700; padding: 12px;
      cursor: pointer; margin-top: 6px; transition: opacity 0.15s; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: default; }

    /* Stats */
    .stats-row { display: flex; gap: 16px; margin-bottom: 28px; }
    .stat-card { flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 20px; }
    .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.07em; margin-bottom: 6px; }
    .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--accent); }

    /* Table */
    .table-wrap { background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; }
    .table-title { padding: 14px 18px; font-size: 0.85rem; font-weight: 600;
      border-bottom: 1px solid var(--border); color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.07em; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 0.75rem; color: var(--muted); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 14px;
      border-bottom: 1px solid var(--border); background: var(--surface2); }
    td { padding: 11px 14px; font-size: 0.88rem; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    /* Badges */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 0.75rem; font-weight: 600; }
    .badge-active { background: rgba(76,175,80,0.15); color: var(--success); }
    .badge-inactive { background: rgba(136,136,136,0.15); color: var(--muted); }
    .badge-disabled { background: rgba(224,92,92,0.15); color: var(--danger); }
    .badge-admin { background: var(--accent-dim); color: var(--accent); }

    /* Disabled user row */
    tr.row-disabled td { opacity: 0.5; }

    /* Action buttons */
    .btn-action { padding: 4px 10px; border-radius: 4px; font-size: 0.78rem;
      cursor: pointer; border: 1px solid; margin-right: 6px; transition: opacity 0.15s; }
    .btn-action:hover { opacity: 0.75; }
    .btn-reset { border-color: var(--border); color: var(--muted); background: transparent; }
    .btn-status { border-color: var(--border); color: var(--muted); background: transparent; }
    .btn-role { border-color: var(--accent); color: var(--accent); background: transparent; }
    .btn-delete { border-color: var(--danger); color: var(--danger); background: transparent; }

    /* Usage */
    .usage-section { margin-top: 32px; }
    .usage-header { display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; }
    .usage-title { font-size: 0.85rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.07em; }
    .range-toggle { display: flex; gap: 6px; }
    .range-btn { padding: 5px 14px; border-radius: 6px; font-size: 0.8rem;
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      cursor: pointer; transition: all 0.15s; }
    .range-btn:hover { border-color: var(--accent); color: var(--accent); }
    .range-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
    .chart-wrap { background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px; margin-bottom: 16px; height: 300px; }
    .badge-ownkey { background: var(--accent-dim); color: var(--accent); }
    .badge-defaultkey { background: rgba(136,136,136,0.15); color: var(--muted); }

    /* Misc */
    .btn-logout { background: none; border: 1px solid var(--border); color: var(--muted);
      font-size: 0.8rem; padding: 6px 14px; border-radius: 5px; cursor: pointer;
      transition: border-color 0.15s, color 0.15s; }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }
    .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 10px; text-align: center; }
    .empty-msg { color: var(--muted); font-size: 0.88rem; padding: 20px; text-align: center; }
    @media (max-width: 600px) {
      .stats-row { flex-direction: column; }
      th:nth-child(4), td:nth-child(4),
      th:nth-child(5), td:nth-child(5) { display: none; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
  const TOKEN_KEY = 'claudio_admin_token';
  let token = sessionStorage.getItem(TOKEN_KEY);
  let currentUser = null;
  let usersData = null;
  let usageDays = 30;
  let usageSummary = null;
  let usageDaily = null;
  let chartUsers = null;
  let chartDaily = null;
  let voicesData = null;
  let aiSettingsData = null;
  let songbookData = null;
  let songbookPollTimer = null;

  function fmtDate(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  async function apiFetch(method, path, body) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(path, {
      method, headers,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || 'Request failed'), { status: res.status });
    return data;
  }

  async function doLogin(email, password) {
    const data = await apiFetch('POST', '/api/auth/login', { email, password });
    token = data.token;
    currentUser = { uid: data.uid, username: data.username };
    sessionStorage.setItem(TOKEN_KEY, token);
    // Verify admin role by hitting /api/admin/users
    const result = await apiFetch('GET', '/api/admin/users');
    usersData = result;
    voicesData = await apiFetch('GET', '/api/admin/voices').catch(() => ({ voices: [] }));
    aiSettingsData = await apiFetch('GET', '/api/admin/ai-settings').catch(() => ({ provider: 'anthropic', model: '' }));
    songbookData = await apiFetch('GET', '/api/admin/songbook').catch(() => null);
    render();
  }

  function doLogout() {
    sessionStorage.removeItem(TOKEN_KEY);
    token = null; currentUser = null; usersData = null;
    render();
  }

  async function loadUsers() {
    try {
      usersData = await apiFetch('GET', '/api/admin/users');
      renderDashboard();
    } catch (e) {
      alert('Failed to load users: ' + e.message);
    }
  }

  async function resetPassword(uid, username) {
    const pw = prompt(`New password for ${username} (min 8 chars):`);
    if (!pw) return;
    if (pw.length < 8) { alert('Password must be at least 8 characters.'); return; }
    try {
      await apiFetch('POST', `/api/admin/users/${uid}/reset-password`, { newPassword: pw });
      alert(`Password reset for ${username}.`);
    } catch (e) { alert('Error: ' + e.message); }
  }

  async function deleteUser(uid, username) {
    if (!confirm(`Delete user "${username}"? This cannot be undone.`)) return;
    try {
      await apiFetch('DELETE', `/api/admin/users/${uid}`);
      await loadUsers();
    } catch (e) { alert('Error: ' + e.message); }
  }

  async function toggleStatus(uid, currentStatus) {
    const newStatus = currentStatus === 'disabled' ? 'active' : 'disabled';
    if (!confirm(`${newStatus === 'disabled' ? 'Disable' : 'Enable'} this user?`)) return;
    try {
      await apiFetch('PUT', `/api/admin/users/${uid}/status`, { status: newStatus });
      await loadUsers();
    } catch (e) { alert('Error: ' + e.message); }
  }

  async function toggleRole(uid, currentRole) {
    const newRole = currentRole === 'admin' ? 'user' : 'admin';
    if (!confirm(`${newRole === 'admin' ? 'Grant admin to' : 'Demote'} this user?`)) return;
    try {
      await apiFetch('PUT', `/api/admin/users/${uid}/role`, { role: newRole });
      await loadUsers();
    } catch (e) { alert('Error: ' + e.message); }
  }

  async function toggleAiPolicy(uid, currentPolicy) {
    const newPolicy = currentPolicy === 'own_only' ? 'global' : 'own_only';
    if (!confirm(`Set AI policy to "${newPolicy}" for this user?`)) return;
    try {
      await apiFetch('PUT', `/api/admin/users/${uid}/ai-policy`, { policy: newPolicy });
      await loadUsers();
    } catch (e) { alert('Error: ' + e.message); }
  }

  function renderLogin(errorMsg) {
    document.getElementById('app').innerHTML = `
<div class="auth-wrap">
  <div class="auth-logo">
    <h1>Claudio</h1>
    <p>Admin Dashboard</p>
  </div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="adm-email" autocomplete="email" placeholder="admin@claudio.local" />
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="adm-pass" autocomplete="current-password" />
  </div>
  ${errorMsg ? `<p class="error-msg">${errorMsg}</p>` : ''}
  <button class="btn-primary" id="adm-login-btn">Sign In</button>
</div>`;
    const btn = document.getElementById('adm-login-btn');
    const login = async () => {
      const email = document.getElementById('adm-email').value.trim();
      const pass  = document.getElementById('adm-pass').value;
      btn.disabled = true; btn.textContent = 'Signing in...';
      try { await doLogin(email, pass); }
      catch (e) {
        btn.disabled = false; btn.textContent = 'Sign In';
        renderLogin(e.status === 403 ? 'Not an admin account.' : (e.message || 'Login failed'));
      }
    };
    btn.addEventListener('click', login);
    document.getElementById('adm-pass').addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
  }

  function renderDashboard() {
    const d = usersData;
    if (!d) return;
    const rows = d.users.map(u => `
<tr class="${u.status === 'disabled' ? 'row-disabled' : ''}">
  <td style="color:var(--muted);font-size:0.78rem">${u.username}</td>
  <td>${u.email}</td>
  <td><span class="badge badge-${u.role === 'admin' ? 'admin' : 'inactive'}">${u.role}</span></td>
  <td>${fmtDate(u.created_at)}</td>
  <td>${fmtDate(u.last_login)}</td>
  <td><span class="badge badge-${u.status === 'disabled' ? 'disabled' : 'active'}">${u.status}</span></td>
  <td><span class="badge ${u.has_own_key ? 'badge-ownkey' : 'badge-defaultkey'}">${u.has_own_key ? 'Yes' : 'No'}</span></td>
  <td><span class="badge ${u.ai_policy === 'own_only' ? 'badge-ownkey' : 'badge-defaultkey'}">${u.ai_policy === 'own_only' ? 'Own Only' : 'Global'}</span></td>
  <td>
    <button class="btn-action btn-reset" onclick="resetPassword('${u.id}','${u.username.replace(/'/g,"\\'")}')">Reset PW</button>
    ${u.id !== currentUser?.uid ? `<button class="btn-action btn-status" onclick="toggleStatus('${u.id}','${u.status}')">${u.status === 'disabled' ? 'Enable' : 'Disable'}</button>` : ''}
    ${u.id !== currentUser?.uid ? `<button class="btn-action btn-role" onclick="toggleRole('${u.id}','${u.role}')">${u.role === 'admin' ? 'Demote' : 'Set as Admin'}</button>` : ''}
    ${u.id !== currentUser?.uid ? `<button class="btn-action btn-status" onclick="toggleAiPolicy('${u.id}','${u.ai_policy}')">${u.ai_policy === 'own_only' ? 'Set Global' : 'Own Key Only'}</button>` : ''}
    ${u.id !== currentUser?.uid ? `<button class="btn-action btn-delete" onclick="deleteUser('${u.id}','${u.username.replace(/'/g,"\\'")}')">Delete</button>` : ''}
  </td>
</tr>`).join('');

    document.getElementById('app').innerHTML = `
<div class="topbar">
  <span class="topbar-title">Claudio Admin</span>
  <div class="topbar-right">
    ${currentUser ? `<span class="topbar-user">${currentUser.username}</span>` : ''}
    <button class="btn-logout" id="adm-logout">Logout</button>
  </div>
</div>
<div class="stats-row">
  <div class="stat-card">
    <div class="stat-label">Total Users</div>
    <div class="stat-value">${d.total}</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Active (30 days)</div>
    <div class="stat-value" style="color:var(--success)">${d.active}</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Inactive</div>
    <div class="stat-value" style="color:var(--muted)">${d.inactive}</div>
  </div>
</div>
<div class="table-wrap">
  <div class="table-title">Users</div>
  ${d.users.length === 0 ? '<div class="empty-msg">No users found.</div>' : `
  <table>
    <thead><tr>
      <th>Username</th><th>Email</th><th>Role</th>
      <th>Registered</th><th>Last Login</th><th>Status</th><th>Own Key</th><th>AI Policy</th><th>Actions</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`}
</div>
<div class="usage-section">
  <div class="usage-header">
    <span class="usage-title">DJ Voices</span>
  </div>
  <div class="table-wrap" style="padding:18px">
    <div class="section-desc" style="margin-bottom:12px;font-size:0.85rem;color:var(--muted)">One voice per language — the DJ picks whichever matches the listener's detected language automatically.</div>
    ${['zh', 'yue', 'en'].map((defaultLang, i) => `
    <div class="voice-row" style="display:flex;gap:10px;margin-bottom:10px;align-items:center">
      <select class="voice-lang" id="voice-lang-${i}"
        style="flex:0.6;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 12px;font-size:0.88rem">
        <option value="zh" ${(voicesData?.voices?.[i]?.lang || defaultLang) === 'zh' ? 'selected' : ''}>中文 (zh)</option>
        <option value="yue" ${(voicesData?.voices?.[i]?.lang || defaultLang) === 'yue' ? 'selected' : ''}>粵語 (yue)</option>
        <option value="en" ${(voicesData?.voices?.[i]?.lang || defaultLang) === 'en' ? 'selected' : ''}>English (en)</option>
      </select>
      <input type="text" class="voice-name" id="voice-name-${i}" placeholder="Name"
        value="${(voicesData?.voices?.[i]?.name || '').replace(/"/g, '&quot;')}"
        style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 12px;font-size:0.88rem" />
      <select class="voice-provider" id="voice-provider-${i}"
        style="flex:0.7;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 12px;font-size:0.88rem">
        <option value="fish" ${(voicesData?.voices?.[i]?.provider || 'fish') === 'fish' ? 'selected' : ''}>Fish</option>
        <option value="minimax" ${voicesData?.voices?.[i]?.provider === 'minimax' ? 'selected' : ''}>MiniMax</option>
      </select>
      <input type="text" class="voice-ref" id="voice-ref-${i}" placeholder="reference_id / voice_id"
        value="${(voicesData?.voices?.[i]?.ref || '').replace(/"/g, '&quot;')}"
        style="flex:1.4;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 12px;font-size:0.88rem;font-family:monospace" />
    </div>`).join('')}
    <button class="btn-action btn-role" id="btn-save-voices" style="margin-top:8px">Save Voices</button>
    <span id="voices-save-msg" style="display:none;color:var(--success);font-size:0.85rem;margin-left:10px">Saved!</span>
  </div>
</div>
<div class="usage-section">
  <div class="usage-header">
    <span class="usage-title">AI Settings</span>
  </div>
  <div class="table-wrap" style="padding:18px">
    <div style="display:flex;gap:10px;margin-bottom:10px;align-items:center">
      <select id="ai-provider-select"
        style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 12px;font-size:0.88rem">
        <option value="anthropic">Anthropic</option>
        <option value="openrouter">OpenRouter</option>
      </select>
      <input type="text" id="ai-model-input" placeholder="Model"
        style="flex:1.4;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 12px;font-size:0.88rem;font-family:monospace" />
    </div>
    <button class="btn-action btn-role" id="btn-save-ai-settings" style="margin-top:8px">Save AI Settings</button>
    <span id="ai-settings-save-msg" style="display:none;color:var(--success);font-size:0.85rem;margin-left:10px">Saved!</span>
  </div>
</div>
<div class="usage-section">
  <div class="usage-header">
    <span class="usage-title">Songbook</span>
  </div>
  <div class="table-wrap" style="padding:18px">
    ${songbookRowsHtml()}
    <button class="btn-action btn-role" id="btn-rebuild-songbook" style="margin-top:8px" ${songbookData?.job?.running ? 'disabled' : ''}>${songbookData?.job?.running ? 'Rebuilding…' : '重建曲库 Rebuild Songbook'}</button>
    <span id="songbook-status-msg" style="font-size:0.82rem;color:var(--muted);margin-left:10px">${songbookStatusText()}</span>
  </div>
</div>
<div class="usage-section">
  <div class="usage-header">
    <span class="usage-title">Usage</span>
    <div class="range-toggle">
      <button class="range-btn ${usageDays === 7 ? 'active' : ''}" data-days="7">7d</button>
      <button class="range-btn ${usageDays === 30 ? 'active' : ''}" data-days="30">30d</button>
      <button class="range-btn ${usageDays === 90 ? 'active' : ''}" data-days="90">90d</button>
    </div>
  </div>
  <div class="chart-wrap"><canvas id="chart-users"></canvas></div>
  <div class="chart-wrap"><canvas id="chart-daily"></canvas></div>
  <div class="table-wrap">
    <div class="table-title">Usage Detail</div>
    <table>
      <thead><tr>
        <th>User</th><th>Claude Input</th><th>Claude Output</th><th>TTS Chars</th><th>Key</th><th>Calls</th>
      </tr></thead>
      <tbody id="usage-table-body">
        <tr><td colspan="6" class="empty-msg">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>`;
    document.getElementById('adm-logout').addEventListener('click', doLogout);
    document.querySelectorAll('.range-btn').forEach(btn => {
      btn.addEventListener('click', () => setUsageDays(Number(btn.dataset.days)));
    });
    document.getElementById('btn-save-voices')?.addEventListener('click', saveVoices);
    const providerSelect = document.getElementById('ai-provider-select');
    const modelInput = document.getElementById('ai-model-input');
    if (providerSelect) providerSelect.value = aiSettingsData?.provider || 'anthropic';
    if (modelInput) modelInput.value = aiSettingsData?.model || '';
    document.getElementById('btn-save-ai-settings')?.addEventListener('click', saveAiSettings);
    document.getElementById('btn-rebuild-songbook')?.addEventListener('click', rebuildSongbook);
    if (songbookData?.job?.running) startSongbookPolling();
    loadUsage();
  }

  async function saveAiSettings() {
    const provider = document.getElementById('ai-provider-select').value;
    const model = document.getElementById('ai-model-input').value.trim();
    if (!model) { alert('Model is required.'); return; }
    const btn = document.getElementById('btn-save-ai-settings');
    btn.disabled = true;
    try {
      await apiFetch('PUT', '/api/admin/ai-settings', { provider, model });
      aiSettingsData = { provider, model };
      const msg = document.getElementById('ai-settings-save-msg');
      if (msg) { msg.style.display = 'inline'; setTimeout(() => { msg.style.display = 'none'; }, 2000); }
    } catch (e) {
      alert('Error: ' + e.message);
    } finally {
      btn.disabled = false;
    }
  }

  async function saveVoices() {
    const rows = [0, 1, 2].map(i => ({
      lang: document.getElementById(`voice-lang-${i}`).value,
      name: document.getElementById(`voice-name-${i}`).value.trim(),
      provider: document.getElementById(`voice-provider-${i}`).value,
      ref: document.getElementById(`voice-ref-${i}`).value.trim(),
    }));
    if (rows.some(r => !r.name || !r.ref)) { alert('All 3 voices need a name and reference_id.'); return; }
    if (new Set(rows.map(r => r.lang)).size !== 3) { alert('Each voice must have a different language (zh/yue/en).'); return; }
    const voices = rows.map((r, idx) => ({ id: `voice${idx + 1}`, name: r.name, lang: r.lang, provider: r.provider, ref: r.ref }));
    const btn = document.getElementById('btn-save-voices');
    btn.disabled = true;
    try {
      await apiFetch('PUT', '/api/admin/voices', { voices });
      voicesData = { voices };
      const msg = document.getElementById('voices-save-msg');
      if (msg) {
        msg.style.display = 'inline';
        setTimeout(() => { msg.style.display = 'none'; }, 2000);
      }
    } catch (e) {
      alert('Error: ' + e.message);
    } finally {
      btn.disabled = false;
    }
  }

  const SONGBOOK_LABELS = {
    'yue-new': '新潮粤语', 'yue-classic': '经典粤语',
    'zh-pop': '华语流行', 'zh-classic': '华语经典', 'en-pop': '英文流行',
  };

  function songbookRowsHtml() {
    const stats = songbookData?.stats;
    if (!stats) return `<div class="section-desc" style="margin-bottom:12px;font-size:0.85rem;color:var(--muted)">曲库尚未生成 — 首次生成大约需要几分钟。</div>`;
    const rows = Object.entries(stats.categories).map(([k, n]) =>
      `<div style="display:flex;justify-content:space-between;font-size:0.85rem;padding:4px 0"><span style="color:var(--muted)">${SONGBOOK_LABELS[k] || k}</span><span>${n} 首</span></div>`
    ).join('');
    return `<div style="margin-bottom:12px">${rows}</div>
    <div style="font-size:0.78rem;color:var(--muted);margin-bottom:12px">最近生成：${fmtDate(stats.builtAt)}</div>`;
  }

  function songbookStatusText() {
    const job = songbookData?.job;
    if (!job) return '';
    if (job.running) return `进行中，已运行 ${Math.round((Date.now() - job.startedAt) / 1000)}s…`;
    if (job.error) return `上次失败：${job.error}`;
    if (job.report) {
      const parts = Object.entries(job.report.categories).map(([k, s]) => `${SONGBOOK_LABELS[k] || k} ${s.verified}/${s.generated}`);
      return `完成：${parts.join('，')}`;
    }
    return '';
  }

  async function rebuildSongbook() {
    if (!confirm('重建曲库会调用 AI 与 YouTube 搜索，耗时可能数分钟。确定要开始吗？')) return;
    const btn = document.getElementById('btn-rebuild-songbook');
    try {
      await apiFetch('POST', '/api/admin/songbook/rebuild');
      songbookData = await apiFetch('GET', '/api/admin/songbook').catch(() => songbookData);
      renderDashboard();
      startSongbookPolling();
    } catch (e) {
      alert('Error: ' + e.message);
    }
  }

  function startSongbookPolling() {
    if (songbookPollTimer) return;
    songbookPollTimer = setInterval(async () => {
      songbookData = await apiFetch('GET', '/api/admin/songbook').catch(() => songbookData);
      const msg = document.getElementById('songbook-status-msg');
      const btn = document.getElementById('btn-rebuild-songbook');
      if (msg) msg.textContent = songbookStatusText();
      if (!songbookData?.job?.running) {
        clearInterval(songbookPollTimer);
        songbookPollTimer = null;
        if (btn) { btn.disabled = false; btn.textContent = '重建曲库 Rebuild Songbook'; }
        alert(songbookData?.job?.error ? `曲库重建失败：${songbookData.job.error}` : '曲库重建完成。');
        renderDashboard();
      } else if (btn) {
        btn.disabled = true; btn.textContent = 'Rebuilding…';
      }
    }, 5000);
  }

  async function loadUsage() {
    try {
      const [summary, daily] = await Promise.all([
        apiFetch('GET', `/api/admin/usage/summary?days=${usageDays}`),
        apiFetch('GET', `/api/admin/usage/daily?days=${usageDays}`),
      ]);
      usageSummary = summary;
      usageDaily = daily;
      renderUsageTable();
      renderCharts();
    } catch (e) {
      console.error('Failed to load usage:', e.message);
    }
  }

  function setUsageDays(days) {
    usageDays = days;
    document.querySelectorAll('.range-btn').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.days) === days);
    });
    loadUsage();
  }

  function renderUsageTable() {
    const tbody = document.getElementById('usage-table-body');
    if (!tbody || !usageSummary) return;
    const rows = usageSummary.users
      .filter(u => u.total_calls > 0)
      .sort((a, b) => (b.claude_input + b.claude_output) - (a.claude_input + a.claude_output));
    tbody.innerHTML = rows.length ? rows.map(u => `
<tr>
  <td>${u.username}</td>
  <td>${(u.claude_input || 0).toLocaleString()}</td>
  <td>${(u.claude_output || 0).toLocaleString()}</td>
  <td>${(u.tts_chars || 0).toLocaleString()}</td>
  <td><span class="badge ${u.own_key_calls > 0 ? 'badge-ownkey' : 'badge-defaultkey'}">${u.own_key_calls > 0 ? 'Own' : 'Default'}</span></td>
  <td>${u.total_calls}</td>
</tr>`).join('') : '<tr><td colspan="6" class="empty-msg">No usage data.</td></tr>';
  }

  function renderCharts() {
    if (typeof Chart === 'undefined') return;
    const userRows = (usageSummary?.users || [])
      .filter(u => (u.claude_input + u.claude_output) > 0)
      .sort((a, b) => (b.claude_input + b.claude_output) - (a.claude_input + a.claude_output))
      .slice(0, 20);

    const ctxUsers = document.getElementById('chart-users');
    if (chartUsers) { chartUsers.destroy(); chartUsers = null; }
    if (ctxUsers) {
      chartUsers = new Chart(ctxUsers, {
        type: 'bar',
        data: {
          labels: userRows.map(u => u.username),
          datasets: [
            { label: 'Input tokens', data: userRows.map(u => u.claude_input), backgroundColor: '#c8a96e' },
            { label: 'Output tokens', data: userRows.map(u => u.claude_output), backgroundColor: '#7a684a' },
          ],
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { stacked: true, ticks: { color: '#888' }, grid: { color: '#2a2a2a' } },
            y: { stacked: true, ticks: { color: '#ccc' }, grid: { color: '#2a2a2a' } },
          },
          plugins: {
            legend: { labels: { color: '#ccc' } },
            title: { display: true, text: `Claude Tokens by User (last ${usageDays}d)`, color: '#ccc' },
          },
        },
      });
    }

    const dailyRows = usageDaily?.daily || [];
    const ctxDaily = document.getElementById('chart-daily');
    if (chartDaily) { chartDaily.destroy(); chartDaily = null; }
    if (ctxDaily) {
      chartDaily = new Chart(ctxDaily, {
        type: 'line',
        data: {
          labels: dailyRows.map(d => d.date),
          datasets: [
            { label: 'Claude tokens/day', data: dailyRows.map(d => d.claude_tokens),
              borderColor: '#c8a96e', backgroundColor: 'rgba(200,169,110,0.15)', tension: 0.3, fill: true },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { ticks: { color: '#888' }, grid: { color: '#2a2a2a' } },
            y: { ticks: { color: '#888' }, grid: { color: '#2a2a2a' } },
          },
          plugins: {
            legend: { labels: { color: '#ccc' } },
            title: { display: true, text: `Site-wide Daily Token Trend (last ${usageDays}d)`, color: '#ccc' },
          },
        },
      });
    }
  }

  async function render() {
    if (!token) { renderLogin(); return; }
    if (!usersData) {
      document.getElementById('app').innerHTML = `<div class="empty-msg" style="margin-top:80px">Loading...</div>`;
      try {
        const data = await apiFetch('GET', '/api/auth/me');
        currentUser = { uid: data.uid, username: data.username };
        usersData = await apiFetch('GET', '/api/admin/users');
        voicesData = await apiFetch('GET', '/api/admin/voices').catch(() => ({ voices: [] }));
        aiSettingsData = await apiFetch('GET', '/api/admin/ai-settings').catch(() => ({ provider: 'anthropic', model: '' }));
        songbookData = await apiFetch('GET', '/api/admin/songbook').catch(() => null);
        renderDashboard();
      } catch (e) {
        if (e.status === 401 || e.status === 403) {
          sessionStorage.removeItem(TOKEN_KEY);
          token = null;
          renderLogin(e.status === 403 ? 'Not an admin account.' : 'Session expired, please login again.');
        } else {
          renderLogin(e.message);
        }
      }
    } else {
      renderDashboard();
    }
  }

  render();
</script>
</body>
</html>
